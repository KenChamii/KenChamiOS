[package]
name = "kenchamios"
version = "0.1.0"
description = "KenChamiOs - a local-first Life OS for a developer"
authors = ["KenChami"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kenchamios_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
uuid = { version = "1.29.2", features = ["v7"] }
thiserror = "2.0.21"
tauri-plugin-dialog = "2"
git2 = "0.21.0"
minijinja = { version = "3.1.0", features = ["serde"] }
similar = "3.2.1"
tauri-plugin-notification = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
keyring = "4.2.0"
tokio = { version = "1.54.1", features = ["time", "net", "sync"] }
csv = "1.4.0"
quick-xml = "0.42.0"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
axum-server = { version = "0.9.0", features = ["tls-rustls-no-provider"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
mdns-sd = "0.21.7"
subtle = "2.6.1"
sha2 = "0.11.1"
if-addrs = "0.15.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-pki-types = "1.15.1"
getrandom = "0.4.3"
tower = { version = "0.5.3", default-features = false, features = ["limit"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs"] }
